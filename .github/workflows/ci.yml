name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the way people will run it: the packed tarball, through npx
      - name: npx smoke test
        shell: bash
        run: |
          npm pack
          npx --yes ./lore-wrapped-*.tgz --version
          npx --yes ./lore-wrapped-*.tgz --json --offline > report.json
          node -e "const r=require('./report.json'); if (!r.version) process.exit(1)"

  personas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: simulated users, every format
        run: node scripts/personas.ts
